
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Factorial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            color: white;
        }

        .contenedor {
            width: 90%;
            max-width: 460px;
            padding: 32px;
            border-radius: 18px;
            background: #1e293b;
            box-shadow: 0 15px 40px #0005;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 15px 0;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #resultado {
            margin-top: 22px;
            overflow-wrap: anywhere;
            font-size: 18px;
            color: #86efac;
        }

        .error {
            color: #fca5a5 !important;
        }

        footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <h1>Factorial</h1>

        <p>
            Calcula el factorial de un número entero no negativo.
        </p>

        <label for="numero">Ingresa un número:</label>
        <input
            type="number"
            id="numero"
            min="0"
            step="1"
            placeholder="Ejemplo: 5"
        >

        <button onclick="calcularFactorial()">
            Calcular factorial
        </button>

        <div id="resultado" aria-live="polite"></div>

        <footer>
            Proyecto académico · Python, pytest y GitHub Actions
        </footer>
    </main>

    <script>
        function calcularFactorial() {
            const entrada = document.getElementById("numero");
            const resultado = document.getElementById("resultado");
            const numero = entrada.valueAsNumber;

            resultado.classList.remove("error");

            if (
                entrada.value.trim() === "" ||
                !Number.isInteger(numero) ||
                numero < 0
            ) {
                resultado.textContent =
                    "Error: ingresa un entero no negativo.";
                resultado.classList.add("error");
                return;
            }

            if (numero > 170) {
                resultado.textContent =
                    "El número es demasiado grande para mostrar su factorial con precisión en esta página.";
                resultado.classList.add("error");
                return;
            }

            let factorial = 1;

            for (let i = 2; i <= numero; i++) {
                factorial *= i;
            }

            resultado.textContent =
                numero + "! = " + factorial;
        }
    </script>
</body>
</html>
